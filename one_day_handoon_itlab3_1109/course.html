<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Player • SkillForge Pro</title>
  <meta name="description" content="Interactive lesson player with dual-mode executive summaries and deep dive production labs.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 antialiased flex flex-col min-h-screen">

  <header id="mainHeader" class="glass-header sticky top-0 z-40 w-full transition-colors"></header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Left Syllabus Sidebar -->
      <aside class="lg:col-span-4 bg-slate-900/90 rounded-2xl border border-slate-800 shadow-xl overflow-hidden sticky top-20" id="courseSidebar">
        <!-- Rendered by player.js -->
        <div class="p-6 text-center text-slate-500 text-xs">Loading course modules...</div>
      </aside>

      <!-- Right Main Lesson Viewer -->
      <article class="lg:col-span-8 space-y-8">
        
        <!-- Lesson Header & Dual-Mode Controls -->
        <div id="lessonHeader"></div>

        <!-- Dynamic Lesson Content (Executive Summary or Deep Dive) -->
        <div id="lessonContentArea"></div>

        <!-- Professional Knowledge Check (Scenario Quiz) -->
        <div id="lessonQuizArea"></div>

        <!-- In-Lesson Scratchpad / Notes -->
        <div id="lessonNotesArea"></div>

        <!-- Lesson Navigation Footer -->
        <div id="lessonNavFooter"></div>

      </article>

    </div>
  </main>

  <footer id="mainFooter"></footer>

  <script src="js/data/courses.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SkillForgePlayer.init();
    });
  </script>
</body>
</html>
