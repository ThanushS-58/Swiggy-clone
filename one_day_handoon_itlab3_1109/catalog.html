<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Catalog • SkillForge Pro</title>
  <meta name="description" content="Explore production curriculum tracks for working professionals in GenAI, Kubernetes, Distributed Systems, and DevSecOps.">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 antialiased flex flex-col min-h-screen">

  <header id="mainHeader" class="glass-header sticky top-0 z-40 w-full transition-colors"></header>

  <main class="flex-1 py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Catalog Header -->
      <div class="max-w-3xl mb-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-semibold uppercase tracking-wider mb-3">
          <i data-lucide="compass" class="w-3.5 h-3.5"></i> Senior Engineering Curriculum
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Specialization Tracks</h1>
        <p class="text-sm sm:text-base text-slate-400 mt-2">
          Designed for software engineers, tech leads, and cloud architects seeking hands-on mastery of 2026 production tools without fluff.
        </p>
      </div>

      <!-- Search & Filters Toolbar -->
      <div class="p-4 rounded-2xl glass-panel mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- Search Input -->
        <div class="relative w-full md:w-80">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="searchInput" type="text" placeholder="Search technologies, tags, keywords..." 
                 oninput="filterCourses()"
                 class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
        </div>

        <!-- Category Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0" id="categoryPillList">
          <button onclick="setCategoryFilter('ALL')" class="category-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shrink-0" data-category="ALL">All Categories</button>
          <button onclick="setCategoryFilter('AI & Machine Learning')" class="category-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white shrink-0" data-category="AI & Machine Learning">AI &amp; ML</button>
          <button onclick="setCategoryFilter('DevOps & Cloud Native')" class="category-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white shrink-0" data-category="DevOps & Cloud Native">Cloud &amp; K8s</button>
          <button onclick="setCategoryFilter('System Design & Architecture')" class="category-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white shrink-0" data-category="System Design & Architecture">System Design</button>
          <button onclick="setCategoryFilter('Security & Cloud Architecture')" class="category-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-slate-400 hover:text-white shrink-0" data-category="Security & Cloud Architecture">DevSecOps</button>
        </div>

      </div>

      <!-- Course Cards Container -->
      <div id="catalogGrid" class="space-y-6"></div>

    </div>
  </main>

  <footer id="mainFooter"></footer>

  <script src="js/data/courses.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

  <script>
    let activeCategory = "ALL";

    function setCategoryFilter(cat) {
      activeCategory = cat;
      document.querySelectorAll(".category-pill").forEach(btn => {
        const matches = btn.getAttribute("data-category") === cat;
        btn.className = `category-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition-all shrink-0 ${
          matches ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400 hover:text-white"
        }`;
      });
      filterCourses();
    }

    function filterCourses() {
      const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      const grid = document.getElementById("catalogGrid");
      if (!grid || !window.SKILLFORGE_COURSES) return;

      const filtered = window.SKILLFORGE_COURSES.filter(course => {
        const matchesCat = activeCategory === "ALL" || course.category === activeCategory;
        const matchesSearch = !search || 
          course.title.toLowerCase().includes(search) || 
          course.overview.toLowerCase().includes(search) ||
          course.tags.some(t => t.toLowerCase().includes(search)) ||
          course.lessons.some(l => l.title.toLowerCase().includes(search));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="text-center py-16 p-6 rounded-2xl glass-panel">
            <i data-lucide="search-x" class="w-12 h-12 text-slate-500 mx-auto mb-3"></i>
            <h3 class="text-base font-bold text-white">No tracks found</h3>
            <p class="text-xs text-slate-400 mt-1">Try adjusting your search terms or category filter.</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map(course => {
        const progress = window.SkillForgeStorage ? window.SkillForgeStorage.getCourseProgress(course.id) : { percent: 0, completed: 0, total: 0 };
        
        return `
          <div class="glass-panel p-6 sm:p-8 rounded-2xl transition-all border border-slate-800 hover:border-slate-700">
            <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-6">
              
              <!-- Left Details -->
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-3 flex-wrap">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                    ${course.category}
                  </span>
                  <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                    ${course.badge}
                  </span>
                  <span class="text-xs text-slate-400 flex items-center gap-1 font-mono">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${course.estHours}
                  </span>
                  <span class="text-xs text-slate-400 flex items-center gap-1 font-mono">
                    <i data-lucide="layers" class="w-3.5 h-3.5"></i> ${course.level}
                  </span>
                </div>

                <h2 class="text-2xl font-bold text-white mb-2">${course.title}</h2>
                <p class="text-sm text-slate-300 mb-4 leading-relaxed">${course.overview}</p>

                <!-- Prerequisites -->
                <div class="text-xs text-slate-400 mb-4 flex items-start gap-1.5">
                  <span class="text-slate-500 font-semibold uppercase">Prerequisites:</span>
                  <span>${course.prerequisites}</span>
                </div>

                <!-- Tags -->
                <div class="flex flex-wrap gap-1.5 mb-6">
                  ${course.tags.map(tag => `<span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${tag}</span>`).join("")}
                </div>

                <!-- Syllabus Accordion -->
                <details class="group bg-slate-950/60 rounded-xl border border-slate-800/80 p-3 text-xs">
                  <summary class="font-semibold text-slate-300 hover:text-white cursor-pointer flex items-center justify-between">
                    <span class="flex items-center gap-1.5">
                      <i data-lucide="list" class="w-3.5 h-3.5 text-indigo-400"></i>
                      View Full Syllabus (${course.lessons.length} Modules &amp; Quizzes)
                    </span>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 group-open:rotate-180 transition-transform"></i>
                  </summary>
                  <div class="mt-3 space-y-2 pt-2 border-t border-slate-800">
                    ${course.lessons.map((lesson, idx) => {
                      const isComplete = window.SkillForgeStorage ? window.SkillForgeStorage.isLessonCompleted(lesson.id) : false;
                      return `
                        <div class="flex items-center justify-between text-slate-400 p-2 rounded-lg bg-slate-900/60">
                          <div class="flex items-center gap-2">
                            <span class="w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center ${isComplete ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-500'}">
                              ${isComplete ? '✔' : (idx + 1)}
                            </span>
                            <span class="text-slate-200 font-medium">${lesson.title}</span>
                          </div>
                          <span class="text-[11px] text-slate-500">${lesson.readTime}</span>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </details>
              </div>

              <!-- Right Actions & Progress -->
              <div class="w-full lg:w-64 shrink-0 bg-slate-900/90 p-5 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div>
                  <div class="text-xs font-semibold text-slate-400 mb-1.5">Completion Status</div>
                  <div class="flex justify-between text-xs text-white font-bold mb-2">
                    <span>${progress.completed} of ${progress.total} Completed</span>
                    <span>${progress.percent}%</span>
                  </div>
                  <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700 mb-6">
                    <div class="bg-gradient-to-r from-indigo-500 to-cyan-500 h-2 rounded-full transition-all duration-500" style="width: ${progress.percent}%"></div>
                  </div>
                </div>

                <div class="space-y-2">
                  <a href="course.html?course=${course.id}" class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/20 transition-all">
                    <span>${progress.percent > 0 ? 'Resume Track' : 'Start Track'}</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </a>
                  ${progress.percent === 100 ? `
                    <a href="profile.html?claim=${course.id}" class="w-full inline-flex items-center justify-center gap-2 py-2 px-3 rounded-xl text-xs font-semibold bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 transition-all">
                      <i data-lucide="award" class="w-3.5 h-3.5"></i>
                      <span>View Certificate</span>
                    </a>
                  ` : ''}
                </div>
              </div>

            </div>
          </div>
        `;
      }).join("");

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener("DOMContentLoaded", () => {
      filterCourses();
    });
  </script>
</body>
</html>
